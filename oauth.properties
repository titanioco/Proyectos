# Google OAuth Configuration Properties
# Replace the values below with your actual Google OAuth credentials

# Your Google OAuth 2.0 Client ID (get this from Google Cloud Console)
# Temporarily commented out to test demo mode
# google.oauth.client.id=639717052187-nao616khtqhnt7a1lesq2plo0eu3vaok.apps.googleusercontent.com

# OAuth redirect URI (must match what's configured in Google Cloud Console)
google.oauth.redirect.uri=http://localhost:8080/oauth/callback

# OAuth scopes (what permissions to request)
google.oauth.scope=openid email profile

# OAuth authorization URL
google.oauth.auth.url=https://accounts.google.com/o/oauth2/v2/auth

# Token exchange URL
google.oauth.token.url=https://oauth2.googleapis.com/token

# User info URL
google.oauth.userinfo.url=https://www.googleapis.com/oauth2/v2/userinfo
